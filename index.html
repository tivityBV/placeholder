<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>'tivity · A new agency model</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: #F4F2ED;
    color: #17150F;
    overflow-x: hidden;
  }
  /* zonlicht dat langzaam over een galeriemuur schuift */
  .sun {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 32%, rgba(120,116,108,0.06) 46%, rgba(140,136,128,0.10) 52%, rgba(120,116,108,0.05) 58%, transparent 72%);
    animation: sweep 30s ease-in-out infinite alternate;
  }
  @keyframes sweep { 0% { transform: translateX(-16%); } 100% { transform: translateX(16%); } }

  .wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 38px 48px; }
  .top img { height: 34px; }
  .loc { font-size: 11px; letter-spacing: 0.22em; color: rgba(23,21,15,0.4); }

  .main {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 20px 28px;
  }
  h1 {
    margin: 0 0 34px; font-weight: 500;
    font-size: clamp(26px, 3.7vw, 48px); line-height: 1.34; letter-spacing: -0.01em;
    max-width: 14ch;
    animation: rise 1.3s cubic-bezier(.16,.84,.28,1) both;
  }
  h1 em { font-style: normal; color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

  .formula {
    display: flex; align-items: flex-end; justify-content: center;
    width: min(460px, 78vw);
    margin: 6px 0 40px;
  }
  .formula img {
    height: auto; display: block;
    opacity: 0;
    transform: translateY(14px) scale(0.96);
    animation: pop 0.7s cubic-bezier(.2,1.3,.35,1) forwards;
  }
  /* elk deel behoudt zijn aandeel in de totale breedte (678 : 260 : 588 van 1526) */
  .formula .p1 { width: 44.4%; animation-delay: 0.9s; }
  .formula .p2 { width: 17.0%; animation-delay: 1.4s; }
  .formula .p3 { width: 38.6%; animation-delay: 1.75s; }
  @keyframes pop {
    0%   { opacity: 0; transform: translateY(14px) scale(0.96); }
    60%  { opacity: 1; transform: translateY(-3px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .formula img { animation: none; opacity: 1; transform: none; }
  }
  .sub {
    margin: 0 0 54px; font-size: 15px; font-weight: 400; line-height: 1.95;
    color: rgba(23,21,15,0.55); max-width: 400px;
    animation: rise 1.3s cubic-bezier(.16,.84,.28,1) 0.35s both;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: #17150F; color: #F4F2ED; text-decoration: none;
    font-size: 15px; font-weight: 500; padding: 15px 32px; border-radius: 999px;
    transition: background .25s, transform .25s;
    animation: rise 1.3s cubic-bezier(.16,.84,.28,1) 0.55s both;
  }
  .cta:hover { background: #3A362E; transform: translateY(-1px); }
  .mail { display: block; margin-top: 20px; font-size: 13px; color: rgba(23,21,15,0.4); animation: rise 1.3s ease-out 0.7s both; }
  .foot { text-align: center; padding: 0 20px 30px; font-size: 12px; color: rgba(23,21,15,0.35); }
  @media (max-width: 640px) { .top { padding: 26px 26px; } }
</style>
</head>
<body>
<div class="sun"></div>
<div class="wrap">
  <div class="top">
    <img src="tivity-logo.png" alt="'tivity">
    <span class="loc">keizersgracht 720</span>
  </div>
  <div class="main">
    <h1>big agency output<br>no agency <em>overhead</em></h1>
    <span class="formula" role="img" aria-label="simplifai · big idea · amplifai">
      <img class="p1" src="sa_part1.png" alt="">
      <img class="p2" src="sa_part2.png" alt="">
      <img class="p3" src="sa_part3.png" alt="">
    </span>
    <p class="sub">a new agency model is taking shape in amsterdam<br>first look on request</p>
    <div>
      <a href="#" id="cta" class="cta">let's talk&nbsp; →</a>
      <span class="mail" id="mail"></span>
    </div>
  </div>
  <div class="foot">© 2026 'tivity · amsterdam</div>
</div>
<script>
(function(){var u='hello',d='tivity.nl',a=u+'@'+d;
document.getElementById('mail').textContent=a;
document.getElementById('cta').addEventListener('click',function(e){e.preventDefault();window.location.href='mail'+'to:'+a;});})();
</script>
</body>
</html>
